<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Órdenes de la Empresa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="loading" class="loading">
    Cargando órdenes...
  </div>

  <ion-list *ngIf="!loading && orders.length">

    <ion-item *ngFor="let o of orders" (click)="openDetail(o)">
      <ion-label>
        <h2>#{{ o.code || o.id }}</h2>

        <p>
          Cliente: {{ o.customer?.nombre || 'N/A' }} <br>
          Vendedor: {{ o.vendor?.user || 'Sin vendedor' }} <br>
          Total: ${{ o.total }} <br>
          Fecha: {{ o.createdAt | date:'short' }}
        </p>
      </ion-label>

      <ion-badge [color]="getStatusColor(o.status)">
        {{ o.status }}
      </ion-badge>
    </ion-item>

  </ion-list>

  <div *ngIf="!loading && orders.length === 0" class="empty">
    No hay órdenes registradas para tu empresa.
  </div>

</ion-content>
