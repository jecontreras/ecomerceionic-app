<ion-header>
  <ion-toolbar>
    <ion-title>Catálogo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- BUSCADOR -->
  <ion-searchbar
    [value]="q || ''"
    (ionChange)="router.navigate([], {
      queryParams: { q: $event.detail.value },
      queryParamsHandling: 'merge'
    })"
    placeholder="Buscar productos">
  </ion-searchbar>

  <!-- SKELETONS -->
  <div *ngIf="loading && products.length === 0" class="grid">
    <div *ngFor="let n of [1,2,3,4,5,6]" class="card">
      <ion-skeleton-text animated style="width: 100%; height: 140px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 70%;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 50%;"></ion-skeleton-text>
    </div>
  </div>

  <!-- LISTA DE PRODUCTOS -->
  <div class="grid" *ngIf="products.length > 0">
    <div
      class="card"
      *ngFor="let p of products"
      (click)="openProduct(p)">

      <img
        [src]="p.image || p.foto || 'assets/img/placeholder.png'"
        class="thumb"/>

      <div class="info">
        <div class="title">{{ p.titulo || p.pro_nombre }}</div>

        <div class="price">
          ${{ p.precioBase }}
        </div>
      </div>
    </div>
  </div>

  <!-- INFINITE SCROLL -->
  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
